name: Nightly Build

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  meta:
    name: Image tags
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - id: tags
        run: echo "tags=nightly,nightly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: meta
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tags: ${{ needs.meta.outputs.tags }}
    secrets: inherit
