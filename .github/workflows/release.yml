name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
      base:
        description: Previous tag or ref to compare from (defaults to the previous tag)
        required: false

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  meta:
    name: Image tags
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - id: tags
        run: |
          tags="${TAG#v}"
          if [[ "$TAG" != *-* ]]; then
            tags="${tags},latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: meta
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
      tags: ${{ needs.meta.outputs.tags }}
    secrets: inherit

  release:
    name: Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Changelog
        id: changelog
        uses: 0PandaDEV/changelog@main
        with:
          head: ${{ env.TAG }}
          base: ${{ github.event.inputs.base }}
          step-summary: "true"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ steps.changelog.outputs.markdown }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" "${flags[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTES" "${flags[@]}"
          fi
