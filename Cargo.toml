[package]
name = "juuz"
description = "An OpenSubsonic server written in Rust that you can also upload to."
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
authors = ["PandaDEV <hello@pandadev.net>"]
homepage = "https://vleer.app"
repository = "https://github.com/vleerapp/juuz"
readme = "README.md"
license = "AGPL-3.0"
keywords = ["opensubsonic", "subsonic", "music", "server", "streaming"]
categories = ["multimedia::audio"]
exclude = ["/data", "/music"]
build = "build.rs"

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
anyhow = "1.0.105"
argon2 = "0.6.0"
audioadapter-buffers = "5.2.0"
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.2"
chacha20poly1305 = "0.11.0"
cuid2 = "0.1.6"
form_urlencoded = "1.2.3"
hex = "0.4.3"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "0.25.5"
md-5 = "0.11.0"
multer = "3.1.0"
notify = "9.0.0"
notify-debouncer-full = "0.8.0"
ogg = "0.9.2"
opus-rs = "0.1.42"
rand = "0.10.4"
rayon = "1.12.0"
roxmltree = "0.21.2"
rubato = "5.1.0"
rust-embed = { version = "8.14.0", features = ["include-exclude"] }
rusqlite = { version = "0.43.0", features = ["bundled", "functions"] }
rusty_aac = "2.3.0"
rusty_mp3 = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
socket2 = "0.6.5"
symphonia = { version = "0.6.1", features = ["all"] }
tokio = { version = "1.54.1", features = ["full"] }
topcoat = { version = "0.12.1", default-features = false, features = ["anyhow", "asset", "cookie", "icon", "router", "runtime", "session", "tower", "view", "websocket"] }
tower = { version = "0.5.3", features = ["util"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "server-graceful", "service", "tokio"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.2", features = ["json"] }
walkdir = "2.5.1"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
hmac = "0.13.0"
nucleo-matcher = "0.3.1"
mdns-sd = "0.22.0"
num-bigint = "0.5.1"
aes = "0.9.4"
cbc = "0.2.1"
sha1 = "0.11.0"
plist = { version = "1.10.4", default-features = false }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[build-dependencies]
oxc_allocator = "0.160.0"
oxc_codegen = "0.160.0"
oxc_parser = "0.160.0"
oxc_semantic = "0.160.0"
oxc_span = "0.160.0"
oxc_transformer = "0.160.0"

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio-tungstenite = "0.30.0"
tempfile = "3.27.0"
hound = "3.5.1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 3
