[package]
name = "juuz"
description = "An OpenSubsonic server written in Rust that you can also upload to."
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["PandaDEV <hello@pandadev.net>"]
homepage = "https://vleer.app"
repository = "https://github.com/vleerapp/juuz"
readme = "README.md"
license = "AGPL-3.0"
keywords = ["opensubsonic", "subsonic", "music", "server", "streaming"]
categories = ["multimedia::audio"]
exclude = ["/data", "/music"]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
audioadapter-buffers = "5.2.0"
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
cuid2 = "0.1.6"
feed-rs = "3.0.0"
form_urlencoded = "1.2.2"
hex = "0.4.3"
httpdate = "1.0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "0.25.4"
md-5 = "0.11.0"
multer = "3.1.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
ogg = "0.9.2"
opus-rs = "0.1.37"
r2d2 = "0.8.10"
r2d2_sqlite = { version = "0.35.0", features = ["bundled"] }
rand = "0.10.3"
rayon = "1.12.0"
rubato = "5.0.1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
rusqlite_migration = "2.6.0"
rusty_aac = "1.1.0"
rusty_mp3 = "1.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
symphonia = { version = "0.6.1", features = ["all"] }
tokio = { version = "1.53.3", features = ["full"] }
topcoat = { version = "0.10.0", default-features = false, features = ["anyhow", "cookie", "router", "session", "tower", "view", "websocket"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio-tungstenite = "0.30.0"
tempfile = "3.27.0"
hound = "3.5.1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
strip = true
